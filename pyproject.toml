[build-system]
requires = ["setuptools", "setuptools-scm", "wheel", "toml"]
build-backend = "setuptools.build_meta"

[project]
name = "lobster-polarion"
version = "0.1.0"
description = "Tool to generate the LOBSTER common interchange format from Polarion work items."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Tobias Haeckel", email = "tobias.haeckel@newtec.de" },
]
license = "GPL-3.0-or-later"
classifiers = [
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13"
]

dependencies = [
    "toml>=0.10.2",
    "bmw-lobster==1.0.*",
]

[project.optional-dependencies]
dev = [
    "toml>=0.10.2",
    "tomlkit>=0.13.2",
    "pylint>=3.3.1",
    "Sphinx>=8.1.3",
    "sphinx-favicon>=1.0.1",
    "sphinx-rtd-theme>=3.0.1",
    "pyinstaller>=6.11.1",
    "pytest>=8.3.3",
    "pytest-cov>=6.0.0",
    "myst-parser>=4.0.0",
    "sphinxcontrib-plantuml>=0.30",
    "sphinx-autoapi>=0.5.0",
    "m2r>=0.3.1",
    "pyTRLCConverter==2.2.*",
]

[project.urls]
documentation = "https://github.com/NewTec-GmbH/lobster-polarion"
repository = "https://github.com/NewTec-GmbH/lobster-polarion"
tracker = "https://github.com/NewTec-GmbH/lobster-polarion/issues"

[project.scripts]
lobster-polarion = "lobster_polarion.__main__:main"

[tool.pytest.ini_options]
pythonpath = [
  "src"
]

[tool.setuptools.package-data]
lobster_polarion = ["pyproject.toml"]
